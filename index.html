<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#116b5b" />
    <title>작탁을 만들자!</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone-shell">
      <div class="status-bar" aria-hidden="true">
        <span>9:41</span>
        <span>LTE 100%</span>
      </div>

      <header class="app-bar">
        <button class="icon-button" id="backButton" type="button" aria-label="홈으로">‹</button>
        <div>
          <p>작탁을 만들자!</p>
          <h1 id="viewTitle">오늘 학습</h1>
        </div>
        <button class="icon-button" id="resetProgress" type="button" aria-label="초기화">↻</button>
      </header>

      <main class="app-content">
        <section class="view active" id="dashboard" aria-labelledby="viewTitle">
          <article class="hero-card">
            <div>
              <p class="eyebrow">리치 마작 입문</p>
              <h2>패를 보고 역을 찾자</h2>
              <p>패 종류, 기본 역, 점수를 짧게 익힙니다.</p>
            </div>
            <div class="hand-row" id="heroHand" aria-label="예시 손패"></div>
          </article>

          <section class="progress-card">
            <div>
              <span>진행률</span>
              <strong id="progressText">0%</strong>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </section>

          <section class="quick-actions" aria-label="빠른 학습">
            <button class="action-card" data-view="tiles" type="button">
              <span>萬</span>
              <strong>패 익히기</strong>
              <small>4종류만 먼저</small>
            </button>
            <button class="action-card" data-view="yaku" type="button">
              <span>立</span>
              <strong>역 단계</strong>
              <small>묶어서 익히기</small>
            </button>
            <button class="action-card" data-view="quiz" type="button">
              <span>✓</span>
              <strong>퀴즈</strong>
              <small>바로 판단하기</small>
            </button>
            <button class="action-card" data-view="score" type="button">
              <span>点</span>
              <strong>점수</strong>
              <small>대략 감 잡기</small>
            </button>
          </section>
        </section>

        <section class="view" id="tiles" aria-labelledby="viewTitle">
          <div class="section-title">
            <p class="eyebrow">패 익히기</p>
            <h2>수패 3종, 자패 7종</h2>
          </div>
          <div class="tile-catalog" id="tileCatalog"></div>
        </section>

        <section class="view" id="yaku" aria-labelledby="viewTitle">
          <div class="section-title">
            <p class="eyebrow">역 단계</p>
            <h2>역을 묶어서 익히기</h2>
          </div>
          <div class="yaku-list" id="yakuList"></div>
          <article class="detail-sheet" id="yakuDetail"></article>
        </section>

        <section class="view" id="quiz" aria-labelledby="viewTitle">
          <article class="quiz-card">
            <div class="quiz-status">
              <span id="quizCount">문제 1 / 4</span>
              <span id="quizScore">정답 0</span>
            </div>
            <h2 id="quizQuestion"></h2>
            <div class="hand-row quiz-tiles" id="quizTiles"></div>
            <div class="answer-grid" id="answerGrid"></div>
            <p class="feedback" id="feedback" role="status"></p>
            <button class="primary-button" id="nextQuiz" type="button">다음</button>
          </article>
        </section>

        <section class="view" id="score" aria-labelledby="viewTitle">
          <article class="score-card">
            <p class="eyebrow">점수 감각</p>
            <h2>판수와 부수만 바꿔보기</h2>
            <label>
              <span>판</span>
              <input id="hanInput" type="range" min="1" max="6" value="2" />
              <strong id="hanValue">2판</strong>
            </label>
            <label>
              <span>부</span>
              <input id="fuInput" type="range" min="20" max="70" step="10" value="30" />
              <strong id="fuValue">30부</strong>
            </label>
          </article>
          <article class="score-result" aria-live="polite">
            <span>론</span>
            <strong id="ronScore">2,000점</strong>
            <span>쯔모</span>
            <strong id="tsumoScore">1,000 / 500점</strong>
            <p id="scoreNote">정확한 암산 전, 구간부터 익힙니다.</p>
          </article>
        </section>

        <p class="asset-credit">
          Tile images: Cangjie6 and contributors, CC BY-SA 4.0, Wikimedia Commons.
        </p>
      </main>

      <nav class="bottom-nav" aria-label="하단 메뉴">
        <button class="nav-item active" data-view="dashboard" type="button">
          <span>⌂</span>
          홈
        </button>
        <button class="nav-item" data-view="tiles" type="button">
          <span>🀇</span>
          패
        </button>
        <button class="nav-item" data-view="yaku" type="button">
          <span>立</span>
          역
        </button>
        <button class="nav-item" data-view="quiz" type="button">
          <span>✓</span>
          퀴즈
        </button>
        <button class="nav-item" data-view="score" type="button">
          <span>点</span>
          점수
        </button>
      </nav>
    </div>

    <script src="script.js"></script>
  </body>
</html>
